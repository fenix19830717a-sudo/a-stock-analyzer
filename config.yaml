# A股智能分析选股系统配置

llm:
  provider: "openai"
  api_key: ""
  model: "gpt-4o"
  temperature: 0.7
  max_tokens: 2000

data:
  primary_source: "akshare"
  backup_source: "baostock"
  cache_enabled: true

backtest:
  initial_capital: 1000000
  commission_rate: 0.0003
  stamp_tax_rate: 0.001
  slippage: 0.001
  stop_loss: 0.07
  take_profit: 0.15
  max_positions: 10
  position_size_pct: 0.1

screening:
  exclude_st: true
  exclude_gem: true
  min_price: 5.0

hmm:
  n_components: 5
  covariance_type: "diag"
  n_iter: 1000

logging:
  level: "INFO"
  file: "data/logs/app.log"
